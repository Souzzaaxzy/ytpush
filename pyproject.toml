[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytpush"
version = "0.1.0"
description = "Search, inspect and download YouTube audio (yt-dlp + ffmpeg) for bots"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["youtube", "yt-dlp", "ffmpeg", "audio", "bot", "download"]
dependencies = [
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.4.9"]
dev = ["pytest>=7", "imageio-ffmpeg>=0.4.9"]

[tool.setuptools.packages.find]
include = ["ytpush*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
